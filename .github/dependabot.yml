version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    # "/" reads .github/workflows; composite actions are found only by their own directory
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    # One pull request per directory: steps of one action (codeql-action init and analyze)
    # must move together, or CodeQL refuses to run
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
