name: CI

on:
  push:
    branches:
      - main
      - "next/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - "next/**"
      - "release/**"
  # prepare-release.yml starts it on the release pull request, which a pull_request event never reaches
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build and test steps execute package code; don't leave the
          # GITHUB_TOKEN readable in .git/config for them.
          persist-credentials: false

      - name: Setup Node + Yarn (Node ${{ matrix.node-version }})
        uses: ./.github/actions/setup-node-yarn
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: yarn build

      - name: Type-check (src without Node types, unit tests, e2e stories and type tests)
        run: yarn typecheck

      - name: Test with coverage
        run: yarn test:coverage --coverageReporters=text --coverageReporters=json-summary

      # Offline: every vendored file under e2e/fixtures/oas/ matches its sha256 and none is unlisted
      - name: Verify the pinned OpenAPI sources
        run: yarn verify:sources

      # The types against the official OpenAPI JSON Schemas, field by field (no network)
      - name: E2E stories
        run: yarn test:e2e

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Test Coverage (Node ${{ matrix.node-version }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Category | Statements | Branches | Functions | Lines |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-----------|----------|-----------|-------|" >> $GITHUB_STEP_SUMMARY
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const row = ['All files', s.statements.pct + '%', s.branches.pct + '%', s.functions.pct + '%', s.lines.pct + '%'];
              console.log('| ' + row.join(' | ') + ' |');
            " >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Test Coverage (Node ${{ matrix.node-version }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Coverage data not available — the test step may have failed before generating coverage." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
